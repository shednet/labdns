apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application
  namespace: applications
  annotations:
    labdns.shednet.dev/enabled: "true"
    labdns.shednet.dev/providers: www,vpn
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: application
            port:
              number: 8080
