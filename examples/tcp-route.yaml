apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: stream
  namespace: applications
  annotations:
    labdns.shednet.dev/enabled: "true"
    labdns.shednet.dev/providers: www
    labdns.shednet.dev/hostnames: tcp.example.com
spec:
  parentRefs:
  - name: public
  rules:
  - backendRefs:
    - name: stream
      port: 9000
