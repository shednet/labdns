version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule: {interval: weekly}
  groups:
    kubernetes-platform:
      patterns:
      - sigs.k8s.io/controller-runtime
      - sigs.k8s.io/external-dns
    kubernetes-patches:
      patterns:
      - k8s.io/*
      update-types:
      - patch
    routine-go-updates:
      patterns:
      - '*'
      exclude-patterns:
      - k8s.io/*
      - sigs.k8s.io/controller-runtime
      - sigs.k8s.io/external-dns
      - sigs.k8s.io/gateway-api
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: k8s.io/*
    update-types:
    - version-update:semver-minor
- package-ecosystem: github-actions
  directory: /
  schedule: {interval: weekly}
  groups:
    github-actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule: {interval: weekly}
  groups:
    container-images:
      patterns:
      - '*'
