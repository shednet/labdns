name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
          cache: true
      - name: Check module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check source, generated artifacts, and packaging
        run: make lint-fmt check-generated check-packaging
      - name: Vet and build
        run: |
          make vet
          go build -o bin/manager ./cmd
      - name: Lint workflows
        run: make lint-workflows

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
          cache: true
      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
          cache: true
      - name: Test
        run: make test

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_CLUSTER: labdns-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_INVOCATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      E2E_DIAGNOSTICS_DIR: /tmp/kind-logs-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/labdns-kind-kubeconfig-github-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      KIND_EXPERIMENTAL_PROVIDER: docker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
          cache: true
      - name: Run isolated dual-stack publication path
        env:
          KIND_NODE_IMAGE: kindest/node:v1.35.0
          E2E_KEEP_CLUSTER_ON_FAILURE: "true"
        run: make test-e2e
      - name: Collect diagnostics
        if: failure()
        run: hack/collect-e2e-diagnostics.sh || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-diagnostics
          path: ${{ env.E2E_DIAGNOSTICS_DIR }}
      - name: Cleanup
        if: always()
        run: make cleanup-test-e2e

  checks:
    name: checks
    if: always()
    needs: [validate, lint, test, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm all CI jobs passed
        run: |
          test '${{ needs.validate.result }}' = success
          test '${{ needs.lint.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.e2e.result }}' = success
