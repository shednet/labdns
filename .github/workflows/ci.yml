name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.1
          cache: true
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting and generated artifacts
        run: make verify-fmt verify-generated verify-artifacts verify-packaging
      - name: Vet
        run: make vet
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Vet and compile E2E-tagged packages
        run: make verify-e2e-build
      - name: Validate workflows
        run: make verify-workflows
      - name: Verify maintainer recipes
        run: make verify-justfile
      - name: Build
        run: make build
