name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          cache_scope: controller-image-amd64
        - arch: arm64
          platform: linux/arm64
          cache_scope: controller-image-arm64
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.cache_scope }}
        cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        test "$DIGEST" != ""
        mkdir -p /tmp/digests
        touch "/tmp/digests/${DIGEST#sha256:}"
    - uses: actions/upload-artifact@v7
      with:
        name: image-digest-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  chart-validate:
    name: chart validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: 1.26.1
        cache: true
    - name: Check chart packaging
      run: make check-packaging

  publish:
    name: publish
    needs: [image, chart-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: image-digest-*
        path: /tmp/digests
        merge-multiple: true
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Package chart
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        helm package charts/labdns --version "$version" --app-version "$GITHUB_REF_NAME" --destination dist
    - name: Publish image manifest
      env:
        REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      run: |
        mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
        test "${#digests[@]}" -eq 2

        refs=()
        for digest in "${digests[@]}"; do
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          refs+=("$REGISTRY_IMAGE@sha256:$digest")
        done

        docker buildx imagetools create "${refs[@]}" --tag "$REGISTRY_IMAGE:$GITHUB_REF_NAME"
    - name: Verify image manifest
      env:
        REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      run: |
        manifest="$(docker buildx imagetools inspect --raw "$REGISTRY_IMAGE:$GITHUB_REF_NAME")"
        jq -e 'any(.. | objects; .platform?.os == "linux" and .platform?.architecture == "amd64")' <<<"$manifest"
        jq -e 'any(.. | objects; .platform?.os == "linux" and .platform?.architecture == "arm64")' <<<"$manifest"
    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
    - name: Push OCI chart
      run: helm push dist/labdns-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
