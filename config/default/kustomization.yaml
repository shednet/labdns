namespace: labdns-system
namePrefix: labdns-

resources:
- ../crd
- ../rbac
- ../manager

patches:
# Gateway API access is opt-in. The generated role retains its marker-derived
# rule; the default deployment removes that rule.
- path: gateway_rbac_disabled_patch.yaml
  target:
    kind: ClusterRole
    name: manager-role

# Preserve Kubebuilder scaffold insertion points.
# +kubebuilder:scaffold:crdkustomizecainjectionns
# +kubebuilder:scaffold:crdkustomizecainjectionname
